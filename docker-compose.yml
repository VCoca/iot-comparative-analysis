services:
  postgres:
    image: postgres:16
    container_name: iot-postgres
    environment:
      POSTGRES_USER: "iotadmin"
      POSTGRES_PASSWORD: "admin"
      POSTGRES_DB: "iot_db"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  grpc-service:
    build:
      context: ./service-grpc/GRPCAirQualityService/GRPCAirQualityService
      dockerfile: Dockerfile
    container_name: iot-grpc
    ports:
      - "5000:8080"
    depends_on:
      - postgres
  rest-service:
    build:
      context: ./service-rest/RESTAirQualityService/RESTAirQualityService/
      dockerfile: Dockerfile
    container_name: iot-rest
    ports:
      - "5001:8080"
    depends_on:
      - postgres
  graphql-service:
    build:
      context: ./service-graphql 
      dockerfile: Dockerfile
    container_name: iot-graphql
    ports:
      - "4000:4000"
    depends_on:
      - postgres
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: iot-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    depends_on:
      - postgres

  prometheus:
    image: prom/prometheus
    container_name: iot-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - cadvisor

  grafana:
    image: grafana/grafana
    container_name: iot-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
volumes:
  pgdata: